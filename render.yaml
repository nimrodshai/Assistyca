services:
  - type: web
    name: assistyca-portal
    env: python
    plan: starter
    autoDeploy: true
    branch: main
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 -u scripts/run_portal_server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /portal/
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PORTAL_MAIL_PROVIDER
        value: resend
      - key: PORTAL_PRODUCT_NAME
        value: Assistyca
      - key: PORTAL_DB_PATH
        value: /var/data/portal.db
      - key: PORTAL_DB_SEED_REGISTERED_EMAILS
        value: nimrod.shai@gmail.com
      - key: PORTAL_DB_SEED_ADMIN_EMAILS
        value: nimrod.shai@gmail.com
      - key: PORTAL_RESEND_FROM_NAME
        value: Assistyca
      - key: PORTAL_BILLING_INPUT_TOKEN_PRICE_MULTIPLIER
        value: "1.5"
      - key: PORTAL_BILLING_OUTPUT_TOKEN_PRICE_MULTIPLIER
        value: "1.5"
      - key: PORTAL_BILLING_MINIMUM_MONTHLY_CHARGE
        value: "50"
      - key: TOKEN_PRICES_API_OPENAI_PRICES_URL
        value: https://token-prices-api.onrender.com/api/openai/prices
      - key: PORTAL_WHATSAPP_REENGAGEMENT_ENABLED
        value: "1"
      - key: PORTAL_WHATSAPP_REENGAGEMENT_TIMEZONE
        value: Asia/Jerusalem
      - key: PORTAL_WHATSAPP_REENGAGEMENT_WEEKDAY
        value: sunday
      - key: PORTAL_WHATSAPP_REENGAGEMENT_HOUR
        value: "9"
      - key: PORTAL_WHATSAPP_REENGAGEMENT_MINUTE
        value: "0"
      - key: PORTAL_WHATSAPP_REENGAGEMENT_INACTIVITY_MONTHS
        value: "6"
      - key: PORTAL_SCHEDULED_MONITOR_ENABLED
        value: "1"
      - key: PORTAL_SCHEDULED_MONITOR_POLL_SECONDS
        value: "300"
      - key: PORTAL_SCHEDULED_MONITOR_MODEL
        value: gpt-5.5
      - key: PORTAL_SCHEDULED_MONITOR_SEARCH_CONTEXT_SIZE
        value: medium
      - key: PORTAL_SCHEDULED_MONITOR_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: PORTAL_SCHEDULED_MONITOR_MAX_ITEMS_PER_RUN
        value: "5"
      - key: PORTAL_SCHEDULED_ACTIONS_ENABLED
        value: "1"
      - key: PORTAL_SCHEDULED_ACTIONS_POLL_SECONDS
        value: "10"
      - key: PORTAL_CONTACT_AGENT_MODEL
        value: gpt-5.5
      - key: PORTAL_ASSISTANT_MODEL
        value: gpt-5.5
      - key: OPENAI_API_KEY
        sync: false
      # Required in practice: with no secret the server falls back to ephemeral
      # in-memory sessions, so every restart signs all users out. At least 32 chars.
      - key: PORTAL_SESSION_SECRET
        sync: false
      - key: PORTAL_CREDENTIALS_KEY
        sync: false
      - key: PORTAL_CREDENTIALS_KEY_VERSION
        value: "1"
      - key: PORTAL_RESEND_API_KEY
        sync: false
      - key: PORTAL_RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_CONTACT_CHAT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: ASSISTYCA_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: ASSISTYCA_WHATSAPP_PHONE_NUMBER_ID
        value: "1186653017865246"
      - key: WHATSAPP_ALLOW_MOCK_SEND
        value: "0"
      - key: WHATSAPP_SAMPLE_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_SAMPLE_TEMPLATE_LANGUAGE
        value: en_US
      - key: WHATSAPP_REPLY_ASSISTANT_FIRST_TEMPLATE_NAME
        value: whatsapp_reply_assistant_1
      - key: WHATSAPP_REPLY_ASSISTANT_REPEAT_TEMPLATE_NAME
        value: whatsapp_reply_assistant_2
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_BUTTON_INDEX
        value: "0"
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_BUTTON_TYPE
        value: quick_reply
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_BUTTON_ACTION
        value: generate
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_DISABLE_BUTTON_INDEX
        value: "1"
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_DISABLE_BUTTON_ACTION
        value: disable_contact
      - key: WHATSAPP_REPLY_ASSISTANT_TEMPLATE_URL_MODE
        value: path
      - key: WHATSAPP_REENGAGEMENT_REPORT_TEMPLATE_NAME
        value: whatsapp_reengagement_report_prompt
      - key: WHATSAPP_REENGAGEMENT_REPORT_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_REENGAGEMENT_REPORT_TEMPLATE_BUTTON_INDEX
        value: "0"
      - key: WHATSAPP_REENGAGEMENT_REPORT_TEMPLATE_BUTTON_ACTION
        value: send
      # WhatsApp Embedded Signup. Both are public identifiers handed to the
      # browser; the flow stays hidden until all three (these plus
      # WHATSAPP_APP_SECRET) are present, and until Meta approves the app as a
      # Tech Provider.
      - key: META_APP_ID
        sync: false
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PORTAL_SUPPORT_PHONE
        value: "+972-50-7322341"
