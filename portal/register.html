<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>An assistant for your business or your family | Assistyca</title>
    <meta
      name="description"
      content="An assistant for your business or your family. A few questions, and your assistant will text you on WhatsApp."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://assistyca.com/register" />
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("/assets/manrope-regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "Manrope";
        src: url("/assets/manrope-medium.ttf") format("truetype");
        font-weight: 500;
        font-style: normal;
      }

      @font-face {
        font-family: "Manrope";
        src: url("/assets/manrope-semibold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        color-scheme: light;
        --bg: #fbf8f1;
        --bg-deep: #f3efe6;
        --surface: rgba(255, 255, 255, 0.82);
        --ink: #132038;
        --muted: #667185;
        --line: rgba(19, 32, 56, 0.12);
        --hairline: rgba(19, 32, 56, 0.07);
        --sand: #d8d0c2;
        --accent: #6aa7a3;
        --accent-deep: #4f9290;
        --accent-soft: rgba(106, 167, 163, 0.14);
        --danger: #b4443c;
        --danger-soft: rgba(180, 68, 60, 0.1);
        --shadow: 0 26px 70px rgba(19, 32, 56, 0.08);
        --slide: 460ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      /* The card is short, so the body box is shorter than the window. Paint
         the paper on the root and pin it to the viewport: on the body it would
         stop where the content stops and leave a seam across the page. */
      html {
        background:
          radial-gradient(60rem 40rem at 110% -10%, var(--accent-soft), transparent 60%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        background-attachment: fixed;
        background-color: var(--bg-deep);
      }

      body {
        font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background: transparent;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .page {
        max-width: 34rem;
        margin: 0 auto;
        padding: 3.5rem 1.35rem 5rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        color: inherit;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .brand img {
        height: 1.6rem;
        width: auto;
        display: block;
      }

      .hero {
        position: relative;
        isolation: isolate;
        margin: 3.25rem 0 2.25rem;
        text-align: center;
        animation: rise-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .hero::before {
        content: "";
        position: absolute;
        z-index: -1;
        top: -4rem;
        left: 50%;
        translate: -50% 0;
        width: 22rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(106, 167, 163, 0.16), rgba(106, 167, 163, 0) 70%);
      }

      h1 {
        max-width: 100%;
        font-size: clamp(1.9rem, 5.8vw, 2.5rem);
        line-height: 1.12;
        margin: 0;
        letter-spacing: -0.032em;
        text-wrap: balance;
      }

      .hero-highlight {
        position: relative;
        display: inline-block;
        color: var(--accent-deep);
      }

      .hero-highlight::after {
        content: "";
        position: absolute;
        z-index: -1;
        right: -0.06em;
        bottom: 0.02em;
        left: -0.04em;
        height: 0.18em;
        border-radius: 999px;
        background: rgba(106, 167, 163, 0.24);
        transform: rotate(-1.5deg);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 1.6rem;
        box-shadow: var(--shadow);
        padding: 1.9rem 1.75rem;
        backdrop-filter: blur(12px);
        animation: rise-in 700ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(0.65rem);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Three questions, one at a time. The answered one slides off to the
         left and the next arrives from the right, so the page reads like a
         short conversation rather than a form to fill in. */
      .progress {
        display: flex;
        justify-content: center;
        gap: 0.4rem;
        list-style: none;
        margin: 0 0 1.6rem;
        padding: 0;
      }

      .progress li {
        width: 1.9rem;
        height: 0.24rem;
        border-radius: 999px;
        background: var(--line);
        transition: background 320ms ease, width 320ms ease;
      }

      .progress li[data-state="current"] {
        width: 2.9rem;
        background: var(--accent-deep);
      }

      .progress li[data-state="done"] {
        background: var(--accent);
      }

      /* The gutter is the card's own padding, taken back with a negative
         margin: a panel slides out of sight exactly at the card's edge, and
         until then nothing of it - focus ring, button shadow - is cut off.
         Sideways only; clipping the height would cut the shadow again.
         clip rather than hidden, which would make this a scroll box and let
         focus scroll the question out of view. */
      .viewport {
        --gutter: 1.75rem;
        box-sizing: content-box;
        position: relative;
        overflow: hidden;
        overflow: clip visible;
        margin: 0 calc(-1 * var(--gutter));
        padding: 0 var(--gutter);
        transition: height var(--slide);
      }

      /* Before the script has measured the first question, hold a plausible
         height and settle into the real one without animating it. */
      .flow:not([data-ready]) .viewport {
        min-height: 21rem;
        transition: none;
      }

      .step {
        position: absolute;
        top: 0;
        left: var(--gutter);
        width: calc(100% - 2 * var(--gutter));
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transform: translateX(115%);
        transition: transform var(--slide), opacity 260ms ease, visibility 0s linear 460ms;
      }

      .step[data-state="past"] {
        transform: translateX(-115%);
      }

      .step[data-state="current"] {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
        transition: transform var(--slide), opacity 320ms ease 120ms, visibility 0s;
      }

      .step-art {
        width: 5.5rem;
        height: 5.5rem;
        margin: 0 auto 1.15rem;
        filter: drop-shadow(0 12px 22px rgba(19, 32, 56, 0.08));
      }

      .step-art svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .step-art .disc {
        fill: rgba(106, 167, 163, 0.13);
        stroke: rgba(106, 167, 163, 0.3);
        stroke-width: 1;
      }

      .step-art .mark {
        fill: none;
        stroke: var(--accent-deep);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .step-art .mark-solid {
        fill: var(--accent-deep);
        stroke: none;
      }

      .step-question {
        display: block;
        font-size: clamp(1.3rem, 4.4vw, 1.55rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.25;
        margin: 0;
      }

      .step-hint {
        margin: 0.45rem auto 1.4rem;
        max-width: 24rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      /* The first question is answered by picking, not by typing. Two cards,
         each a real radio so the arrow keys and the screen reader behave; the
         card itself is the label, so the whole thing is the target. */
      .choices {
        display: grid;
        gap: 0.7rem;
        /* The cards stand where the hint used to leave the field: this
           question has no line under it, so the room comes from here. */
        margin: 1.3rem 0 0;
      }

      .choice {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 0.9rem;
        text-align: left;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 1.1rem;
        background: #fff;
        cursor: pointer;
        transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
      }

      .choice:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .choice input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }

      .choice:has(input:focus-visible) {
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .choice:has(input:checked) {
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      /* Nothing picked yet: the teal focus ring on the first card would read
         as a choice already made, so while the question is unanswered both
         cards wear the error colour instead. */
      .field[data-invalid="true"] .choice {
        border-color: var(--danger);
      }

      .field[data-invalid="true"] .choice:has(input:focus-visible) {
        box-shadow: 0 0 0 4px var(--danger-soft);
      }

      .choice-art {
        flex: 0 0 auto;
        width: 2.6rem;
        height: 2.6rem;
        margin-top: 0.1rem;
      }

      .choice-art svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* The same pen as the big step icons; without it an SVG path falls back
         to a solid black fill and the card grows a black square. */
      .choice-art .mark {
        fill: none;
        stroke: var(--accent-deep);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .choice-title {
        display: block;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .choice-line {
        display: block;
        margin-top: 0.15rem;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      /* The last question has an icon for each kind; only the chosen one
         is in the layout, so the panel keeps its height. */
      .step[data-kind="business"] .for-family,
      .step[data-kind="family"] .for-business {
        display: none;
      }

      .field {
        display: block;
        text-align: left;
      }

      .field input,
      .field select {
        width: 100%;
        font: inherit;
        color: inherit;
        padding: 0.85rem 1rem;
        border-radius: 0.9rem;
        border: 1px solid var(--line);
        background: #fff;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .field[data-invalid="true"] input,
      .field[data-invalid="true"] select {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px var(--danger-soft);
      }

      .field-error {
        display: none;
        color: var(--danger);
        font-size: 0.86rem;
        margin-top: 0.4rem;
        text-align: center;
      }

      .field[data-invalid="true"] .field-error {
        display: block;
      }

      /* The phone is two parts that read as one line: the country, then the
         national number. The dial code is shown, not typed. */
      .phone-row {
        display: grid;
        grid-template-columns: minmax(9rem, 2fr) 3fr;
        gap: 0.6rem;
      }

      .phone-national {
        position: relative;
        display: flex;
        align-items: center;
      }

      .phone-dial {
        position: absolute;
        left: 0.95rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }

      .phone-national input {
        padding-left: var(--dial-width, 4rem);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      .phone-preview {
        display: block;
        margin-top: 0.5rem;
        color: var(--muted);
        font-size: 0.86rem;
        font-variant-numeric: tabular-nums;
        text-align: center;
        min-height: 1.2rem;
      }

      .honeypot {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .step-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        margin-top: 1.5rem;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.9rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font: inherit;
        font-weight: 600;
        min-height: 3.35rem;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition: transform 120ms ease, background 120ms ease;
      }

      .step-actions .button-primary {
        width: 100%;
      }

      .button-primary {
        background: linear-gradient(135deg, #72b0ac, #5f9f9a);
        color: #fff;
        box-shadow: 0 18px 36px rgba(106, 167, 163, 0.24);
      }

      .button-primary:hover {
        box-shadow: 0 22px 44px rgba(106, 167, 163, 0.28);
      }

      .button-primary:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      .button-secondary {
        background: transparent;
        color: var(--ink);
        border-color: var(--line);
      }

      .button-secondary:hover {
        background: var(--accent-soft);
      }

      .button-quiet {
        background: none;
        border: 0;
        color: var(--muted);
        font: inherit;
        font-size: 0.9rem;
        min-height: 2.5rem;
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        cursor: pointer;
      }

      .button-quiet:hover {
        color: var(--ink);
      }

      .status {
        margin: 1.1rem 0 0;
        min-height: 1.4rem;
        font-size: 0.95rem;
        color: var(--muted);
        text-align: center;
      }

      .status[data-tone="error"] {
        color: var(--danger);
      }

      .status a {
        color: var(--accent-deep);
      }

      .fine-print {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        text-align: center;
      }

      .fine-print a {
        color: var(--accent-deep);
      }

      .done {
        text-align: center;
      }

      .done h2 {
        margin: 0 0 0.6rem;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
      }

      .done p {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 1.02rem;
      }

      .done .number {
        color: var(--ink);
        font-weight: 700;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 480px) {
        .page {
          padding-top: 2.5rem;
        }

        .card {
          padding: 1.5rem 1.25rem;
          border-radius: 1.3rem;
        }

        .hero {
          margin: 2.5rem 0 1.85rem;
        }

        .viewport {
          --gutter: 1.25rem;
        }

        .phone-row {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .card {
          animation: none;
        }

        .viewport,
        .step,
        .progress li {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="/about" aria-label="Assistyca">
        <img src="/assets/AssistycaLogoTitle.png" alt="Assistyca" />
      </a>

      <header class="hero">
        <h1>An assistant designed for <span class="hero-highlight" data-hero-word>you</span></h1>
      </header>

      <section class="card">
        <form data-register-form novalidate>
          <div class="flow" data-flow>
            <ol class="progress" data-progress aria-hidden="true">
              <li data-state="current"></li>
              <li></li>
              <li></li>
              <li></li>
            </ol>

            <div class="viewport" data-viewport>
              <section class="step" data-step="kind" data-state="current">
                <div class="step-art" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <path class="mark" d="M32 17v10" />
                    <path class="mark" d="M32 27 20 37" />
                    <path class="mark" d="m32 27 12 10" />
                    <circle class="mark" cx="20" cy="42" r="5" />
                    <circle class="mark" cx="44" cy="42" r="5" />
                  </svg>
                </div>
                <p class="step-question" id="register-kind-question">Who am I helping?</p>
                <div class="field" data-field="kind">
                  <div class="choices" role="radiogroup" aria-labelledby="register-kind-question">
                    <label class="choice">
                      <input type="radio" name="kind" value="business" data-kind-choice />
                      <span class="choice-art" aria-hidden="true">
                        <svg viewBox="0 0 64 64" role="img">
                          <rect class="mark" x="14" y="23" width="36" height="24" rx="4" />
                          <path class="mark" d="M25 23v-3a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v3" />
                          <path class="mark" d="M14.5 32.5h35" />
                        </svg>
                      </span>
                      <span>
                        <span class="choice-title">My business</span>
                        <span class="choice-line">
                          The inbox, the calendar, the receipts and the follow-ups you would rather not hold in
                          your head.
                        </span>
                      </span>
                    </label>
                    <label class="choice">
                      <input type="radio" name="kind" value="family" data-kind-choice />
                      <span class="choice-art" aria-hidden="true">
                        <svg viewBox="0 0 64 64" role="img">
                          <circle class="mark" cx="22" cy="24" r="6" />
                          <circle class="mark" cx="42" cy="24" r="6" />
                          <path class="mark" d="M12 46a10 10 0 0 1 20 0" />
                          <path class="mark" d="M32 46a10 10 0 0 1 20 0" />
                        </svg>
                      </span>
                      <span>
                        <span class="choice-title">My family</span>
                        <span class="choice-line">
                          The afternoon runs: who is driving, when to leave, and a nudge when nobody has taken
                          the pickup - shared with the other parents.
                        </span>
                      </span>
                    </label>
                  </div>
                  <span class="field-error" data-error-for="kind"></span>
                </div>
              </section>

              <section class="step" data-step="name">
                <div class="step-art" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <circle class="mark" cx="32" cy="26" r="6.5" />
                    <path class="mark" d="M20.5 44a11.5 11.5 0 0 1 23 0" />
                  </svg>
                </div>
                <label class="step-question" for="register-name">What should I call you?</label>
                <p class="step-hint">Your first and last name.</p>
                <div class="field" data-field="name">
                  <input id="register-name" name="name" type="text" autocomplete="name" required />
                  <span class="field-error" data-error-for="name"></span>
                </div>
                <div class="step-actions">
                  <button class="button button-primary" type="button" data-next>Continue</button>
                </div>
              </section>

              <section class="step" data-step="phone">
                <div class="step-art" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <path
                      class="mark"
                      d="M18 22.5a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4H30l-7.5 6v-6H22a4 4 0 0 1-4-4z"
                    />
                    <circle class="mark-solid" cx="26" cy="29" r="1.7" />
                    <circle class="mark-solid" cx="32" cy="29" r="1.7" />
                    <circle class="mark-solid" cx="38" cy="29" r="1.7" />
                  </svg>
                </div>
                <label class="step-question" for="register-phone">Which number do you use on WhatsApp?</label>
                <div class="field" data-field="phone">
                  <div class="phone-row">
                    <select name="country" data-phone-country aria-label="Country"></select>
                    <div class="phone-national">
                      <span class="phone-dial" data-phone-dial aria-hidden="true"></span>
                      <input
                        id="register-phone"
                        name="national"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        data-phone-national
                        required
                      />
                    </div>
                  </div>
                  <span class="phone-preview" data-phone-preview aria-live="polite"></span>
                  <span class="field-error" data-error-for="phone"></span>
                </div>
                <div class="step-actions">
                  <button class="button button-primary" type="button" data-next>Continue</button>
                  <button class="button-quiet" type="button" data-back>Back</button>
                </div>
              </section>

              <section class="step" data-step="business" data-kind="business">
                <div class="step-art for-business" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <rect class="mark" x="16" y="23" width="32" height="20" rx="4" />
                    <path class="mark" d="M26 23v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" />
                    <path class="mark" d="M16.6 31.5h30.8" />
                  </svg>
                </div>
                <div class="step-art for-family" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <path class="mark" d="M17 41V31l15-11 15 11v10a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3z" />
                    <path class="mark" d="M27.5 44v-8h9v8" />
                  </svg>
                </div>
                <label class="step-question" for="register-business" data-about-question>And what do you do?</label>
                <p class="step-hint" data-about-hint>A line is enough, for example "I run a small architecture studio".</p>
                <div class="field" data-field="business">
                  <input
                    id="register-business"
                    name="business"
                    type="text"
                    autocomplete="organization-title"
                    required
                  />
                  <span class="field-error" data-error-for="business"></span>
                </div>
                <div class="step-actions">
                  <button class="button button-primary" type="submit" data-register-submit>Register and text me</button>
                  <button class="button-quiet" type="button" data-back>Back</button>
                </div>
              </section>
            </div>
          </div>

          <label class="honeypot" for="register-company-website">Company website</label>
          <input class="honeypot" id="register-company-website" name="companyWebsite" type="text" tabindex="-1" autocomplete="off" />

          <p class="status" data-register-status role="status" aria-live="polite"></p>
          <p class="fine-print">
            Already have an account? Click <a href="/whatsapp">here</a>.<br />
            By registering you agree to the <a href="/privacy.html">privacy policy</a>.
          </p>
        </form>

        <div class="done" data-register-done hidden>
          <h2 data-done-title>Check WhatsApp</h2>
          <p data-done-text></p>
          <div class="actions">
            <a class="button button-primary" data-done-link href="#" target="_blank" rel="noopener" hidden>Open WhatsApp</a>
          </div>
        </div>
      </section>
    </main>
    <script src="/portal/register.js" defer></script>
  </body>
</html>
