<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Let's get you started | Assistyca</title>
    <meta
      name="description"
      content="An assistant for your business or your family. A few questions, and your assistant will text you on WhatsApp."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://assistyca.com/register" />
    <script src="/portal/register-address.js"></script>
    <link rel="preload" as="font" type="font/woff2" href="/assets/manrope-regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/manrope-semibold.woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("/assets/manrope-regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Manrope";
        src: url("/assets/manrope-medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Manrope";
        src: url("/assets/manrope-semibold.woff2") format("woff2");
        font-weight: 600 700;
        font-style: normal;
        font-display: swap;
      }

      /* The landing page's palette: warm paper, one muted teal, hairlines
         instead of borders. */
      :root {
        color-scheme: light;
        --bg: #fbf8f1;
        --surface: rgba(255, 255, 255, 0.86);
        --ink: #132038;
        --ink-soft: #2c3a52;
        --muted: #667185;
        --line: rgba(19, 32, 56, 0.12);
        --hairline: rgba(19, 32, 56, 0.08);
        --track: rgba(19, 32, 56, 0.09);
        --accent: #62a39b;
        --accent-deep: #4f9290;
        --accent-soft: rgba(106, 167, 163, 0.14);
        --danger: #b4443c;
        --danger-soft: rgba(180, 68, 60, 0.1);
        --shadow: 0 30px 80px rgba(19, 32, 56, 0.08);
        --slide: 460ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      html {
        background: var(--bg);
      }

      body {
        position: relative;
        font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* The same stones and leaves as the landing page, held still behind the
         card. A fixed layer rather than background-attachment, which iOS
         ignores. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--bg) url("/assets/landing-bg-mobile.webp") center bottom / cover no-repeat;
      }

      .page {
        max-width: 36rem;
        margin: 0 auto;
        padding: 2.4rem 1.25rem 4rem;
        text-align: center;
      }

      .brand {
        display: inline-block;
        color: inherit;
        text-decoration: none;
        font-size: 1.55rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .hero {
        margin: 0.9rem 0 1.9rem;
        animation: rise-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .kicker {
        margin: 0 0 1.9rem;
        font-size: 0.74rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.1rem, 8.6vw, 3.2rem);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .card {
        text-align: left;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 1.75rem;
        box-shadow: var(--shadow);
        padding: 1.9rem 1.75rem 1.6rem;
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        animation: rise-in 700ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(0.65rem);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* The questions come one at a time. The answered one slides off to the
         left and the next arrives from the right, so the page reads like a
         short conversation rather than a form to fill in. */
      .progress {
        display: flex;
        justify-content: center;
        gap: 0.45rem;
        list-style: none;
        margin: 0 0 1.5rem;
        padding: 0;
      }

      .progress li {
        width: 2.6rem;
        height: 0.24rem;
        border-radius: 999px;
        background: var(--track);
        transition: background 320ms ease;
      }

      .progress li[data-state="current"],
      .progress li[data-state="done"] {
        background: var(--accent);
      }

      /* The gutter is the card's own padding, taken back with a negative
         margin: a panel slides out of sight exactly at the card's edge, and
         until then nothing of it - focus ring, button shadow - is cut off.
         Sideways only; clipping the height would cut the shadow again.
         clip rather than hidden, which would make this a scroll box and let
         focus scroll the question out of view. */
      .viewport {
        --gutter: 1.75rem;
        box-sizing: content-box;
        position: relative;
        overflow: hidden;
        overflow: clip visible;
        margin: 0 calc(-1 * var(--gutter));
        padding: 0 var(--gutter);
        transition: height var(--slide);
      }

      /* Before the script has measured the first question, hold a plausible
         height and settle into the real one without animating it. */
      .flow:not([data-ready]) .viewport {
        min-height: 19rem;
        transition: none;
      }

      .step {
        position: absolute;
        top: 0;
        left: var(--gutter);
        width: calc(100% - 2 * var(--gutter));
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transform: translateX(115%);
        transition: transform var(--slide), opacity 260ms ease, visibility 0s linear 460ms;
      }

      /* Nothing moves before the script has placed the first question: the
         page opens on it rather than sliding over to it. */
      .flow:not([data-ready]) .step,
      .flow:not([data-ready]) .progress li {
        transition: none;
      }

      /* When the landing page already asked who this is for, the question is
         not part of this page at all - no card, no dash for it, and no Back
         on the name, which would promise a step behind it. A family's page
         has no "what do you do" either. The name is in
         place from the first paint, before the script arrives. */
      html[data-kind-known] .step[data-step="kind"],
      html[data-kind-known] .progress li[data-dot="kind"],
      html[data-kind-known="family"] .step[data-step="business"],
      html[data-kind-known="family"] .progress li[data-dot="business"],
      html[data-kind-known] .step[data-step="name"] [data-back] {
        display: none;
      }

      html[data-kind-known] .flow:not([data-ready]) .step[data-step="name"] {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
      }

      html[data-kind-known] .flow:not([data-ready]) .progress li[data-dot="name"] {
        background: var(--accent);
      }

      .step[data-state="past"] {
        transform: translateX(-115%);
      }

      .step[data-state="current"] {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
        transition: transform var(--slide), opacity 320ms ease 120ms, visibility 0s;
      }

      .step-art {
        width: 4.6rem;
        height: 4.6rem;
        margin: 0 auto 1rem;
      }

      .step-art svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .step-art .disc {
        fill: rgba(106, 167, 163, 0.1);
        stroke: rgba(106, 167, 163, 0.22);
        stroke-width: 0.8;
      }

      .step-art .mark {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .step-art .mark-solid {
        fill: var(--accent);
        stroke: none;
      }

      .step-question {
        display: block;
        font-size: clamp(1.35rem, 5.4vw, 1.6rem);
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.25;
        margin: 0;
      }

      .step-hint {
        margin: 0.45rem auto 1.3rem;
        max-width: 24rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      /* Who this is for is answered by picking, not by typing. Two cards,
         each a real radio so the arrow keys and the screen reader behave; the
         card itself is the label, so the whole thing is the target. */
      .choices {
        display: grid;
        gap: 0.7rem;
        margin: 1.3rem 0 0;
      }

      .choice {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 0.9rem;
        text-align: left;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 1.1rem;
        background: #fff;
        cursor: pointer;
        transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
      }

      .choice:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .choice input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }

      .choice:has(input:focus-visible) {
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .choice:has(input:checked) {
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      /* Nothing picked yet: the teal focus ring on the first card would read
         as a choice already made, so while the question is unanswered both
         cards wear the error colour instead. */
      .field[data-invalid="true"] .choice {
        border-color: var(--danger);
      }

      .field[data-invalid="true"] .choice:has(input:focus-visible) {
        box-shadow: 0 0 0 4px var(--danger-soft);
      }

      .choice-art {
        flex: 0 0 auto;
        width: 2.6rem;
        height: 2.6rem;
        margin-top: 0.1rem;
      }

      .choice-art svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* The same pen as the big step icons; without it an SVG path falls back
         to a solid black fill and the card grows a black square. */
      .choice-art .mark {
        fill: none;
        stroke: var(--accent-deep);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .choice-title {
        display: block;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .choice-line {
        display: block;
        margin-top: 0.15rem;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      /* A family is not asked what it does: the phone is its last question,
         so the phone carries the button that sends. */
      .step[data-kind="business"] .for-family,
      .step[data-kind="family"] .for-business {
        display: none;
      }

      .field {
        display: block;
        text-align: left;
      }

      /* A question that needs no explanation has no hint under it, and the
         hint is what used to hold the field off the question. */
      .step-question + .field {
        margin-top: 1.3rem;
      }

      /* First and last name are two halves of one answer, so they sit on one
         line the way the country and the number do. */
      .name-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      .field input::placeholder {
        color: var(--muted);
        opacity: 0.8;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 3.4rem;
        font: inherit;
        color: inherit;
        padding: 0.85rem 1rem;
        border-radius: 0.95rem;
        border: 1px solid var(--line);
        background: #fff;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .field[data-invalid="true"] input,
      .field[data-invalid="true"] select {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px var(--danger-soft);
      }

      .field-error {
        display: none;
        color: var(--danger);
        font-size: 0.86rem;
        margin-top: 0.4rem;
        text-align: center;
      }

      .field[data-invalid="true"] .field-error {
        display: block;
      }

      /* The phone is two parts that read as one line: the country, then the
         national number. The dial code is shown, not typed. */
      .phone-row {
        display: grid;
        grid-template-columns: minmax(9rem, 2fr) 3fr;
        gap: 0.75rem;
      }

      .phone-national {
        position: relative;
        display: flex;
        align-items: center;
      }

      .phone-dial {
        position: absolute;
        left: 0.95rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }

      .phone-national input {
        padding-left: var(--dial-width, 4rem);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      .phone-preview {
        display: block;
        margin-top: 0.5rem;
        color: var(--muted);
        font-size: 0.86rem;
        font-variant-numeric: tabular-nums;
        text-align: center;
        min-height: 1.2rem;
      }

      .honeypot {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .step-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.4rem;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.9rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font: inherit;
        font-weight: 500;
        font-size: 1.02rem;
        min-height: 3.35rem;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .step-actions .button-primary {
        width: 100%;
      }

      .button-primary {
        background: linear-gradient(135deg, #5f9f96, #6db3a9);
        color: #fff;
        box-shadow: 0 16px 32px rgba(98, 163, 155, 0.25);
      }

      .button-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 40px rgba(98, 163, 155, 0.3);
      }

      .button-primary:disabled {
        opacity: 0.6;
        cursor: progress;
        transform: none;
      }

      .button-secondary {
        background: #fff;
        color: var(--ink);
        border-color: var(--line);
      }

      .button-secondary:hover {
        background: var(--accent-soft);
      }

      .button-quiet {
        background: none;
        border: 0;
        color: var(--ink-soft);
        font: inherit;
        font-size: 0.95rem;
        min-height: 2.5rem;
        padding: 0.35rem 1rem;
        border-radius: 999px;
        cursor: pointer;
      }

      .button-quiet:hover {
        color: var(--accent-deep);
      }

      .status {
        margin: 0.4rem 0 0;
        min-height: 1.2rem;
        font-size: 0.95rem;
        color: var(--muted);
        text-align: center;
      }

      .status:empty {
        min-height: 0;
      }

      .status[data-tone="error"] {
        color: var(--danger);
      }

      .status a {
        color: var(--accent-deep);
      }

      /* A hairline, then the two things everyone may need and nobody should
         have to look for */
      .fine-print {
        margin: 1.3rem 0 0;
        padding-top: 1.3rem;
        border-top: 1px solid var(--hairline);
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.7;
        text-align: center;
      }

      .fine-print a {
        color: var(--accent-deep);
        text-underline-offset: 0.18em;
      }

      .done {
        text-align: center;
      }

      /* The landing page's robot holding up the message it just sent. The
         picture carries its own sage blob, so it sits straight on the card. */
      .done-art {
        display: block;
        width: min(100%, 17rem);
        height: auto;
        aspect-ratio: 720 / 649;
        margin: -0.4rem auto 1.1rem;
        object-fit: contain;
      }

      .done h2 {
        margin: 0 0 0.6rem;
        font-size: clamp(1.75rem, 7vw, 2.2rem);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .done [data-done-text] {
        margin: 0 auto;
        max-width: 26rem;
        color: var(--muted);
        font-size: 1.02rem;
        text-wrap: pretty;
      }

      .done .number {
        color: var(--ink);
        font-weight: 600;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      /* The landing page's teal, not WhatsApp's green: the logo already says
         where the button goes */
      .button-whatsapp {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 16px 34px rgba(98, 163, 155, 0.26);
      }

      .button-whatsapp:hover {
        background: var(--accent-deep);
        transform: translateY(-1px);
      }

      .button-whatsapp svg {
        width: 1.45rem;
        height: 1.45rem;
        flex: none;
      }

      .done-or {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 1rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .done-or::before,
      .done-or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .done-or[hidden] {
        display: none;
      }

      .button-secondary:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .done .status {
        margin-top: 0.9rem;
      }

      /* Once the message is out the page has done its job: the invitation to
         get started steps aside and the robot leads. */
      html[data-registered] .hero {
        display: none;
      }

      html[data-registered] .page {
        padding-top: 1.6rem;
      }

      html[data-registered] .brand {
        margin-bottom: 1.4rem;
      }

      @media (max-width: 480px) {
        .card {
          padding: 1.7rem 1.25rem 1.4rem;
          border-radius: 1.5rem;
        }

        .viewport {
          --gutter: 1.25rem;
        }

        .phone-row,
        .name-row {
          grid-template-columns: 1fr;
        }
      }

      /* A wide screen gets the wide photograph, a quieter wordmark and more
         air between the words and the card */
      @media (min-width: 48rem) {
        body::before {
          background-image: url("/assets/landing-bg-desktop.webp");
          background-position: center 70%;
        }

        .page {
          padding-top: 2.6rem;
        }

        .brand {
          font-size: 1.2rem;
        }

        .hero {
          margin: 2.6rem 0 2.6rem;
        }

        .kicker {
          font-size: 0.7rem;
          margin-bottom: 3.2rem;
        }

        .card {
          max-width: 33.5rem;
          margin: 0 auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .card {
          animation: none;
        }

        .viewport,
        .step,
        .progress li {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="/">Assistyca</a>

      <header class="hero">
        <p class="kicker">Less to juggle. More life.</p>
        <h1>Let's get you started.</h1>
      </header>

      <section class="card">
        <form data-register-form novalidate>
          <div class="flow" data-flow>
            <ol class="progress" data-progress aria-hidden="true">
              <li data-dot="kind" data-state="current"></li>
              <li data-dot="name"></li>
              <li data-dot="phone"></li>
              <li data-dot="business"></li>
            </ol>

            <div class="viewport" data-viewport>
              <section class="step" data-step="kind" data-state="current">
                <div class="step-art" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <path class="mark" d="M32 17v10" />
                    <path class="mark" d="M32 27 20 37" />
                    <path class="mark" d="m32 27 12 10" />
                    <circle class="mark" cx="20" cy="42" r="5" />
                    <circle class="mark" cx="44" cy="42" r="5" />
                  </svg>
                </div>
                <p class="step-question" id="register-kind-question">Who am I helping?</p>
                <div class="field" data-field="kind">
                  <div class="choices" role="radiogroup" aria-labelledby="register-kind-question">
                    <label class="choice">
                      <input type="radio" name="kind" value="business" data-kind-choice />
                      <span class="choice-art" aria-hidden="true">
                        <svg viewBox="0 0 64 64" role="img">
                          <rect class="mark" x="14" y="23" width="36" height="24" rx="4" />
                          <path class="mark" d="M25 23v-3a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v3" />
                          <path class="mark" d="M14.5 32.5h35" />
                        </svg>
                      </span>
                      <span>
                        <span class="choice-title">My business</span>
                        <span class="choice-line">
                          The inbox, the calendar, the receipts and the follow-ups you would rather not hold in
                          your head.
                        </span>
                      </span>
                    </label>
                    <label class="choice">
                      <input type="radio" name="kind" value="family" data-kind-choice />
                      <span class="choice-art" aria-hidden="true">
                        <svg viewBox="0 0 64 64" role="img">
                          <circle class="mark" cx="22" cy="24" r="6" />
                          <circle class="mark" cx="42" cy="24" r="6" />
                          <path class="mark" d="M12 46a10 10 0 0 1 20 0" />
                          <path class="mark" d="M32 46a10 10 0 0 1 20 0" />
                        </svg>
                      </span>
                      <span>
                        <span class="choice-title">My family</span>
                        <span class="choice-line">
                          The afternoon runs: who is driving, when to leave, and a nudge when nobody has taken
                          the pickup - shared with the other parents.
                        </span>
                      </span>
                    </label>
                  </div>
                  <span class="field-error" data-error-for="kind"></span>
                </div>
              </section>

              <section class="step" data-step="name">
                <div class="step-art" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <circle class="mark" cx="32" cy="26" r="6.5" />
                    <path class="mark" d="M20.5 44a11.5 11.5 0 0 1 23 0" />
                  </svg>
                </div>
                <label class="step-question" for="register-first-name">What's your name?</label>
                <div class="field" data-field="name">
                  <div class="name-row">
                    <input
                      id="register-first-name"
                      name="firstName"
                      type="text"
                      autocomplete="given-name"
                      aria-label="First name"
                      placeholder="First name"
                      required
                    />
                    <input
                      id="register-last-name"
                      name="lastName"
                      type="text"
                      autocomplete="family-name"
                      aria-label="Last name"
                      placeholder="Last name"
                      required
                    />
                  </div>
                  <span class="field-error" data-error-for="name"></span>
                </div>
                <div class="step-actions">
                  <button class="button button-primary" type="button" data-next>Continue</button>
                  <button class="button-quiet" type="button" data-back>Back</button>
                </div>
              </section>

              <section class="step" data-step="phone" data-kind="business">
                <div class="step-art" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <path
                      class="mark"
                      d="M18 22.5a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4H30l-7.5 6v-6H22a4 4 0 0 1-4-4z"
                    />
                    <circle class="mark-solid" cx="26" cy="29" r="1.7" />
                    <circle class="mark-solid" cx="32" cy="29" r="1.7" />
                    <circle class="mark-solid" cx="38" cy="29" r="1.7" />
                  </svg>
                </div>
                <label class="step-question" for="register-phone">Which number do you use on WhatsApp?</label>
                <div class="field" data-field="phone">
                  <div class="phone-row">
                    <select name="country" data-phone-country aria-label="Country"></select>
                    <div class="phone-national">
                      <span class="phone-dial" data-phone-dial aria-hidden="true"></span>
                      <input
                        id="register-phone"
                        name="national"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        data-phone-national
                        required
                      />
                    </div>
                  </div>
                  <span class="phone-preview" data-phone-preview aria-live="polite"></span>
                  <span class="field-error" data-error-for="phone"></span>
                </div>
                <div class="step-actions">
                  <button class="button button-primary for-business" type="button" data-next>Continue</button>
                  <button class="button button-primary for-family" type="submit" data-register-submit>Register and text me</button>
                  <button class="button-quiet" type="button" data-back>Back</button>
                </div>
              </section>

              <section class="step" data-step="business">
                <div class="step-art" aria-hidden="true">
                  <svg viewBox="0 0 64 64" role="img">
                    <circle class="disc" cx="32" cy="32" r="30" />
                    <rect class="mark" x="16" y="23" width="32" height="20" rx="4" />
                    <path class="mark" d="M26 23v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" />
                    <path class="mark" d="M16.6 31.5h30.8" />
                  </svg>
                </div>
                <label class="step-question" for="register-business">And what do you do?</label>
                <p class="step-hint">A line is enough, for example "I run a small architecture studio".</p>
                <div class="field" data-field="business">
                  <input
                    id="register-business"
                    name="business"
                    type="text"
                    autocomplete="organization-title"
                    required
                  />
                  <span class="field-error" data-error-for="business"></span>
                </div>
                <div class="step-actions">
                  <button class="button button-primary" type="submit" data-register-submit>Register and text me</button>
                  <button class="button-quiet" type="button" data-back>Back</button>
                </div>
              </section>
            </div>
          </div>

          <label class="honeypot" for="register-company-website">Company website</label>
          <input class="honeypot" id="register-company-website" name="companyWebsite" type="text" tabindex="-1" autocomplete="off" />

          <p class="status" data-register-status role="status" aria-live="polite"></p>
          <p class="fine-print">
            Already have an account? Click <a href="/whatsapp">here</a>.<br />
            By registering you agree to the <a href="/privacy.html">privacy policy</a>.
          </p>
        </form>

        <div class="done" data-register-done hidden>
          <img class="done-art" src="/assets/robot-sent-message-2.webp" width="720" height="649" alt="" />
          <h2 data-done-title>Check WhatsApp</h2>
          <p data-done-text></p>
          <div class="actions">
            <a class="button button-whatsapp" data-done-link href="#" target="_blank" rel="noopener" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2Zm0 18.15a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 4.54 0 8.23 3.7 8.23 8.24 0 4.55-3.7 8.24-8.24 8.24Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.14.16-.29.18-.54.06-.25-.13-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.44.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.35-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></svg>
              <span>Open WhatsApp</span>
            </a>
            <p class="done-or" data-done-or hidden>or</p>
            <button class="button button-secondary" type="button" data-done-resend hidden>Didn't get it? Send again</button>
          </div>
          <p class="status" data-done-status role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="/portal/register.js" defer></script>
  </body>
</html>
