name: Package Layout

on:
  push:
  pull_request:

jobs:
  check-package-layout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check package layout
        run: python3 scripts/check_package_layout.py
